name: Update goals

on:
  schedule:
    # Sunday evening, after the day's matches have finished. GitHub's shared
    # scheduler runs these 1-3 hours late, so they land roughly 8pm-11pm UK.
    # Two slots cover both BST and GMT and give a second chance if one is
    # dropped; whichever arrives first does the work and the other stands down.
    - cron: "0 19 * * 0"
    - cron: "0 20 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-goals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to run
        id: gate
        run: |
          today=$(TZ=Europe/London date +%F)
          last=$(python3 scripts/last_update.py)
          echo "Today in London: $today — last update: $last"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$last" != "$today" ]; then
            echo "go=yes" >> "$GITHUB_OUTPUT"
          else
            echo "go=no" >> "$GITHUB_OUTPUT"
            echo "Already updated today, so this is the back-up slot standing down."
          fi

      - name: Fetch latest goals
        if: steps.gate.outputs.go == 'yes'
        run: python3 scripts/update.py

      # A font or Pillow hiccup must never block the goals, which are the point.
      - name: Rebuild the link preview
        if: steps.gate.outputs.go == 'yes'
        continue-on-error: true
        run: |
          python3 -m pip install --quiet --disable-pip-version-check Pillow
          python3 scripts/make_og.py

      - name: Commit if anything changed
        if: steps.gate.outputs.go == 'yes'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/standings.json og.png index.html; then
            echo "No change this week."
          else
            git add data/standings.json og.png index.html
            git commit -m "Update goals — $(TZ=Europe/London date '+%d %b %Y')"
            git push
          fi

      # Runs even when the job stood down, so a stall can never look like success.
      - name: Fail if the goals have gone stale
        if: always()
        run: python3 scripts/check_fresh.py
