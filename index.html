<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Race to 21</title>
<meta name="description" content="Four players. Twenty-one goals. The 2026/27 Premier League sweepstake.">
<meta property="og:title" content="Race to 21">
<meta property="og:description" content="Four players. Twenty-one goals. The 2026/27 Premier League sweepstake.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
<style>
  :root{
    --bg:#0a0e14; --bg2:#0f141c; --card:#141b26; --card2:#1a2331;
    --line:#232e3f; --text:#e8edf5; --dim:#8a97ab; --faint:#5c6878;
    --accent:#2fe08a; --accent2:#17b8ff; --gold:#ffc93c; --warn:#ff8a5c;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -8px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text); min-height:100vh;
    font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    background-image:radial-gradient(900px 500px at 50% -10%,rgba(47,224,138,.10),transparent 70%);
    background-repeat:no-repeat;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:40px 16px 72px}

  header{text-align:center;margin-bottom:34px}
  .kicker{
    display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:700;
    letter-spacing:.14em;text-transform:uppercase;color:var(--accent);
    background:rgba(47,224,138,.09);border:1px solid rgba(47,224,138,.22);
    padding:6px 13px;border-radius:999px;margin-bottom:16px;
  }
  h1{
    font-size:clamp(40px,9vw,76px);line-height:.95;letter-spacing:-.035em;font-weight:800;
    background:linear-gradient(170deg,#fff 20%,#9fb0c6);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sub{color:var(--dim);margin-top:14px;font-size:15px;max-width:520px;margin-inline:auto}
  .meta{
    margin-top:18px;display:flex;gap:9px;justify-content:center;flex-wrap:wrap;
    font-size:12px;color:var(--faint);
  }
  .chip{background:var(--card);border:1px solid var(--line);padding:5px 12px;border-radius:999px;white-space:nowrap}
  .chip b{color:var(--dim);font-weight:600}

  .grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}

  .card{
    background:linear-gradient(180deg,var(--card),var(--bg2));
    border:1px solid var(--line);border-radius:16px;padding:18px;
    box-shadow:var(--shadow);position:relative;overflow:hidden;
    transition:transform .18s ease,border-color .18s ease;
  }
  .card:hover{transform:translateY(-2px);border-color:#2f3d52}
  .card.lead{border-color:rgba(255,201,60,.4)}
  .card.lead::before{
    content:"";position:absolute;inset:0 0 auto;height:2px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
  }
  .card.done{border-color:rgba(47,224,138,.55)}

  .top{display:flex;align-items:center;gap:11px;margin-bottom:16px}
  .rank{
    width:27px;height:27px;flex:none;border-radius:8px;display:grid;place-items:center;
    font-size:12px;font-weight:800;background:var(--card2);color:var(--dim);border:1px solid var(--line);
  }
  .lead .rank{background:linear-gradient(140deg,#ffc93c,#ff9d2e);color:#3d2600;border-color:transparent}
  .who{font-size:19px;font-weight:700;letter-spacing:-.01em;flex:1;min-width:0}
  .tot{text-align:right;line-height:1}
  .tot b{font-size:31px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .tot span{display:block;font-size:10px;color:var(--faint);letter-spacing:.1em;text-transform:uppercase;margin-top:4px}

  .bar{height:5px;border-radius:999px;background:#1d2634;overflow:hidden;margin-bottom:5px}
  .bar i{
    display:block;height:100%;border-radius:999px;
    background:linear-gradient(90deg,var(--accent2),var(--accent));
    transition:width .7s cubic-bezier(.2,.8,.2,1);
  }
  .lead .bar i{background:linear-gradient(90deg,var(--gold),#ff9d2e)}
  .togo{font-size:11px;color:var(--faint);margin-bottom:15px;display:flex;justify-content:space-between}
  .togo b{color:var(--dim);font-weight:600}

  ul{list-style:none;display:flex;flex-direction:column;gap:2px}
  li{
    display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;
    background:rgba(255,255,255,.017);transition:background .15s;
  }
  li:hover{background:rgba(255,255,255,.045)}
  li.scored{background:rgba(47,224,138,.055)}
  .pos{
    font-size:9px;font-weight:800;letter-spacing:.05em;color:var(--faint);
    background:var(--card2);border-radius:4px;padding:3px 5px;width:32px;text-align:center;flex:none;
  }
  .nm{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tm{font-size:11px;color:var(--faint);margin-left:7px}
  .g{
    font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;min-width:22px;text-align:right;
    color:var(--faint);
  }
  li.scored .g{color:var(--accent)}
  .out{font-size:9px;color:var(--warn);border:1px solid rgba(255,138,92,.3);border-radius:4px;padding:2px 4px;margin-left:6px}

  footer{margin-top:40px;text-align:center;color:var(--faint);font-size:12px;line-height:1.9}
  footer a{color:var(--dim)}
  .state{text-align:center;padding:70px 20px;color:var(--dim)}
  @media (max-width:520px){ .wrap{padding:28px 13px 56px} .card{padding:15px} }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">⚽ Premier League <span id="season">2026/27</span></div>
    <h1>Race to 21</h1>
    <p class="sub">Four players each. First to land <b>exactly 21</b> goals takes it.</p>
    <div class="meta" id="meta"></div>
  </header>
  <main id="app"><div class="state">Loading the latest goals…</div></main>
  <footer>
    Goals from the official Premier League player data feed · own goals not counted<br>
    Updates automatically every Sunday at 8pm UK time
  </footer>
</div>
<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(d) {
  document.getElementById('season').textContent = d.season;

  const when = new Date(d.generated).toLocaleString('en-GB', {
    day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/London'
  });
  document.getElementById('meta').innerHTML = [
    `<b>Gameweek</b> ${d.gameweeksPlayed} of 38`,
    `<b>Target</b> ${d.target} goals`,
    `<b>Updated</b> ${esc(when)}`
  ].map(t => `<span class="chip">${t}</span>`).join('');

  document.getElementById('app').innerHTML = '<div class="grid">' + d.people.map(p => {
    const hit  = p.total === d.target;
    const lead = p.rank === 1 && p.total > 0;
    const pct  = Math.min(100, (p.total / d.target) * 100);

    const togo = hit ? 'On the number 🎯'
               : p.remaining > 0 ? `<b>${p.remaining}</b> to go`
               : `<b>${-p.remaining}</b> over`;

    const rows = p.players.map(pl => `
      <li class="${pl.goals > 0 ? 'scored' : ''}">
        <span class="pos">${esc(pl.position)}</span>
        <span class="nm">${esc(pl.name)}<span class="tm">${esc(pl.teamShort)}</span>${
          pl.active ? '' : '<span class="out">OUT</span>'}</span>
        <span class="g">${pl.goals}</span>
      </li>`).join('');

    return `<article class="card ${lead ? 'lead' : ''} ${hit ? 'done' : ''}">
      <div class="top">
        <span class="rank">${p.rank}</span>
        <span class="who">${esc(p.name)}</span>
        <span class="tot"><b>${p.total}</b><span>goals</span></span>
      </div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="togo"><span>${togo}</span><span>${p.total} / ${d.target}</span></div>
      <ul>${rows}</ul>
    </article>`;
  }).join('') + '</div>';
}

fetch('data/standings.json?v=' + Date.now())
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(render)
  .catch(e => {
    document.getElementById('app').innerHTML =
      '<div class="state">Could not load the standings. Please try again shortly.</div>';
    console.error(e);
  });
</script>
</body>
</html>
