<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e14">
<meta name="color-scheme" content="dark">
<title>Race to 21</title>
<meta name="description" content="Four players. Twenty-one goals. The 2026/27 Premier League sweepstake.">
<meta property="og:title" content="Race to 21">
<meta property="og:description" content="Four players. Twenty-one goals. The 2026/27 Premier League sweepstake.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
<style>
  :root{
    --bg:#0a0e14; --bg2:#0f141c; --card:#141b26; --card2:#1a2331;
    --line:#232e3f; --text:#e8edf5; --dim:#8a97ab; --faint:#5c6878;
    --accent:#2fe08a; --accent2:#17b8ff; --gold:#ffc93c; --warn:#ff8a5c;
    --bust:#ff4d6a; --bust2:#ff8a3c;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -8px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text); min-height:100vh;
    font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    background-image:radial-gradient(900px 500px at 50% -10%,rgba(47,224,138,.10),transparent 70%);
    background-repeat:no-repeat;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:40px 16px 72px;
    padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}

  header{text-align:center;margin-bottom:34px}
  .kicker{
    display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:700;
    letter-spacing:.14em;text-transform:uppercase;color:var(--accent);
    background:rgba(47,224,138,.09);border:1px solid rgba(47,224,138,.22);
    padding:6px 13px;border-radius:999px;margin-bottom:16px;
  }
  h1{
    font-size:clamp(40px,9vw,76px);line-height:.95;letter-spacing:-.035em;font-weight:800;
    background:linear-gradient(170deg,#fff 20%,#9fb0c6);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sub{color:var(--dim);margin-top:14px;font-size:15px;max-width:520px;margin-inline:auto}
  .meta{
    margin-top:18px;display:flex;gap:9px;justify-content:center;flex-wrap:wrap;
    font-size:12px;color:var(--faint);
  }
  .chip{background:var(--card);border:1px solid var(--line);padding:5px 12px;border-radius:999px;white-space:nowrap}
  .chip b{color:var(--dim);font-weight:600}

  .grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}

  .card{
    background:linear-gradient(180deg,var(--card),var(--bg2));
    border:1px solid var(--line);border-radius:16px;padding:18px;
    box-shadow:var(--shadow);position:relative;overflow:hidden;
    transition:transform .18s ease,border-color .18s ease;
  }
  .card:hover{transform:translateY(-2px);border-color:#2f3d52}
  .card.lead{border-color:rgba(255,201,60,.4)}
  .card.done{border-color:rgba(47,224,138,.55)}
  .card::before{
    content:"";position:absolute;inset:0 0 auto;height:3px;z-index:2;
    background:linear-gradient(90deg,var(--c1),var(--c2));
  }
  .card::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 100% 0,var(--ink),transparent 58%);
    opacity:.07;
  }
  .card>*{position:relative;z-index:1}
  .card>.crest{
    position:absolute;top:-10px;right:-14px;width:104px;height:104px;
    fill:var(--ink);opacity:.085;pointer-events:none;z-index:0;
  }
  .club{
    display:flex;align-items:center;gap:5px;margin-top:3px;
    font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);
  }
  .club svg{width:13px;height:13px;fill:var(--ink);flex:none;opacity:.95}
  .card.bust{
    border-color:rgba(255,77,106,.45);
    background:linear-gradient(180deg,#1d1418,var(--bg2));
  }
  .card.bust::before{background:linear-gradient(90deg,var(--bust2),var(--bust))}
  .card.bust::after{background:radial-gradient(120% 90% at 100% 0,var(--bust),transparent 58%);opacity:.1}
  .card.bust .crest{fill:var(--bust)}
  .card.bust .rank{background:rgba(255,77,106,.14);color:#ff8fa3;border-color:rgba(255,77,106,.3)}
  .card.bust .tot b{color:#ff8fa3}
  .card.bust .bar i{background:linear-gradient(90deg,var(--bust2),var(--bust))}
  .card.bust .togo b{color:#ff8fa3}
  .badge{
    display:inline-flex;align-items:center;gap:4px;vertical-align:middle;margin-left:8px;
    font-size:10px;font-weight:800;letter-spacing:.09em;color:#fff;
    background:linear-gradient(135deg,var(--bust),var(--bust2));
    padding:3px 8px 3px 6px;border-radius:999px;
    box-shadow:0 1px 6px rgba(255,77,106,.4);
  }
  .badge svg{width:11px;height:11px;flex:none}

  .top{display:flex;align-items:center;gap:11px;margin-bottom:16px}
  .rank{
    width:27px;height:27px;flex:none;border-radius:8px;display:grid;place-items:center;
    font-size:12px;font-weight:800;background:var(--card2);color:var(--dim);border:1px solid var(--line);
  }
  .lead .rank{background:linear-gradient(140deg,#ffc93c,#ff9d2e);color:#3d2600;border-color:transparent}
  .who{flex:1;min-width:0}
  .who .nom{font-size:19px;font-weight:700;letter-spacing:-.01em;display:block}
  .tot{text-align:right;line-height:1}
  .tot b{font-size:31px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .tot span{display:block;font-size:10px;color:var(--faint);letter-spacing:.1em;text-transform:uppercase;margin-top:4px}

  .bar{height:5px;border-radius:999px;background:#1d2634;overflow:hidden;margin-bottom:5px}
  .bar i{
    display:block;height:100%;border-radius:999px;
    background:linear-gradient(90deg,var(--accent2),var(--accent));
    transition:width .7s cubic-bezier(.2,.8,.2,1);
  }
  .lead .bar i{background:linear-gradient(90deg,var(--gold),#ff9d2e)}
  .togo{font-size:11px;color:var(--faint);margin-bottom:15px;display:flex;justify-content:space-between}
  .togo b{color:var(--dim);font-weight:600}

  ul{list-style:none;display:flex;flex-direction:column;gap:2px}
  li{
    display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;
    background:rgba(255,255,255,.017);transition:background .15s;
  }
  li:hover{background:rgba(255,255,255,.045)}
  li.scored{background:rgba(47,224,138,.055)}
  .pos{
    font-size:9px;font-weight:800;letter-spacing:.05em;color:var(--faint);
    background:var(--card2);border-radius:4px;padding:3px 5px;width:32px;text-align:center;flex:none;
  }
  .nm{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tm{font-size:11px;color:var(--faint);margin-left:7px}
  .g{
    font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;min-width:22px;text-align:right;
    color:var(--faint);
  }
  li.scored .g{color:var(--accent)}
  .out{font-size:9px;color:var(--warn);border:1px solid rgba(255,138,92,.3);border-radius:4px;padding:2px 4px;margin-left:6px}

  footer{margin-top:40px;text-align:center;color:var(--faint);font-size:12px;line-height:1.9}
  footer a{color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(47,224,138,.3)}
  footer a:hover{border-bottom-color:var(--accent)}
  .state{text-align:center;padding:70px 20px;color:var(--dim)}
  @media (max-width:560px){
    .wrap{padding:26px 14px 52px}
    h1{font-size:clamp(38px,13vw,60px)}
    .sub{font-size:14px;max-width:300px}
    .meta{gap:7px;font-size:11px}
    .chip{padding:5px 10px}
    .grid{gap:13px;grid-template-columns:1fr}
    .card{padding:15px 14px;border-radius:14px}
    .who .nom{font-size:18px}
    .tot b{font-size:28px}
    li{padding:11px 10px}
    .nm{font-size:15px}
    .g{font-size:15px}
    header{margin-bottom:26px}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">⚽ Premier League <span id="season">2026/27</span></div>
    <h1>Race to 21</h1>
    <p class="sub">Four players each. First to land <b>exactly 21</b> goals takes it.</p>
    <div class="meta" id="meta"></div>
  </header>
  <main id="app"><div class="state">Loading the latest goals…</div></main>
  <footer>
    Goals from the official <a id="feed" href="https://fantasy.premierleague.com/api/bootstrap-static/" target="_blank" rel="noopener">Premier League data feed</a> · own goals not counted<br>
    Browse the <a href="https://www.premierleague.com/stats/top/players/goals" target="_blank" rel="noopener">full Premier League scorer list</a><br>
    Updates automatically every Sunday at 8pm UK time
  </footer>
</div>
<script>
const CRESTS = {"cannon": "<path d=\"M2.6 7.6h14.2v5.6H2.6z\"/><path d=\"M16.4 6.4h2.9a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-2.9z\"/><path d=\"M2.6 12.2h6.2l-4.4 8.4H.8z\"/><path fill-rule=\"evenodd\" d=\"M9.9 12.6a4.7 4.7 0 1 1 0 9.4 4.7 4.7 0 0 1 0-9.4zm0 3.1a1.6 1.6 0 1 0 0 3.2 1.6 1.6 0 0 0 0-3.2z\"/>", "bird": "<path d=\"M1.4 15.3c2.6-2.4 5.6-3.3 9-2.7l5.8-3.2c1.3-.7 2.5.6 1.8 1.8l-2 3.3c-1.9 3.2-5.6 4.8-9.6 4.1z\"/><path d=\"M10.4 12.6C8.7 8.4 9.2 4.7 11.9 1.6c1.1 3.9.7 7.4-1.2 10.6z\"/><path d=\"M8.2 18.4c.5 2.4 1.9 4 4.2 4.9-.3-2.2-1.1-3.9-2.4-5.2z\"/><path d=\"M17.6 9.2 22.4 7l-3.6 4z\"/><circle cx=\"16.4\" cy=\"10.4\" r=\"0.85\"/>", "trident": "<path d=\"M11 1.6h2v20.8h-2z\"/><path d=\"M4.6 4.6h2v5.1c0 2.1 1.9 3.4 5.4 3.6v2C7 15.1 4.6 13 4.6 9.7z\"/><path d=\"M19.4 4.6h-2v5.1c0 2.1-1.9 3.4-5.4 3.6v2c5 -.2 7.4-2.3 7.4-5.6z\"/><path d=\"M8.6 20.1h6.8v1.9H8.6z\"/>", "cherries": "<circle cx=\"7.6\" cy=\"17.4\" r=\"4.3\"/><circle cx=\"16.8\" cy=\"18.4\" r=\"3.6\"/><path d=\"M7.1 13.2C7.6 8.4 10 4.6 14.4 2.3l.9 1.7c-3.7 2-5.7 5.2-6.2 9.4z\" /><path d=\"M16.4 14.9c-.9-4-.4-7.4 1.4-10.3l1.7 1c-1.5 2.4-1.9 5.2-1.1 8.7z\"/><path d=\"M14.6 2.1c2.4-.7 4.4-.2 6 1.5-1.9 1.3-3.9 1.5-6 .6z\"/>", "lion": "<path fill-rule=\"evenodd\" d=\"M12.00 -0.20 L14.80 4.29 L19.84 2.65 L19.10 7.90 L24.01 9.88 L20.08 13.42 L22.57 18.10 L17.27 18.28 L16.17 23.46 L12.00 20.20 L7.83 23.46 L6.73 18.28 L1.43 18.10 L3.92 13.42 L-0.01 9.88 L4.90 7.90 L4.16 2.65 L9.20 4.29 Z M18.9 12a6.9 6.9 0 1 0-13.8 0 6.9 6.9 0 1 0 13.8 0 Z\"/><path d=\"M7.4 6.9a2.4 2.4 0 0 1 2.6 1.5 6.6 6.6 0 0 0-2.9 1.7zM16.6 6.9a2.4 2.4 0 0 0-2.6 1.5 6.6 6.6 0 0 1 2.9 1.7z\"/><path d=\"M8.1 10.1l3.1 1.2-.5 1.5-3.2-1.4zM15.9 10.1l-3.1 1.2.5 1.5 3.2-1.4z\"/><path d=\"M12 13.2l1.8 1.4a1.8 1.8 0 0 1-3.6 0z\"/><path d=\"M9.6 16.1a2.1 2.1 0 0 0 2.4 1.4 2.1 2.1 0 0 0 2.4-1.4 2.6 2.6 0 0 1-4.8 0z\"/>"};

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(d) {
  document.getElementById('season').textContent = d.season;
  if (d.sourceUrl) document.getElementById('feed').href = d.sourceUrl;

  const when = new Date(d.generated).toLocaleString('en-GB', {
    day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/London'
  });
  document.getElementById('meta').innerHTML = [
    `<b>Gameweek</b> ${d.gameweeksPlayed} of 38`,
    `<b>Target</b> ${d.target} goals`,
    `<b>Updated</b> ${esc(when)}`
  ].map(t => `<span class="chip">${t}</span>`).join('');

  const BURST = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">'
    + '<path d="M12 1.6l2.3 4.2 4.3-2.2-1.4 4.6 4.7 1-3.6 3.1 3.2 3.5-4.8.3.6 4.8-4.1-2.5-2.6 4.1-1.8-4.5-4.5 1.7 1.3-4.6-4.6-1.4 3.9-2.8L1.7 7l4.8-.6L6.4 1.6l4 2.6z"/></svg>';

  document.getElementById('app').innerHTML = '<div class="grid">' + d.people.map(p => {
    const hit  = p.total === d.target;
    const bust = p.bust === true || p.total > d.target;
    const lead = p.rank === 1 && p.total > 0 && !bust;
    const pct  = Math.min(100, (p.total / d.target) * 100);

    const togo = bust ? `<b>${p.total - d.target}</b> over the line`
               : hit ? 'On the number 🎯'
               : `<b>${p.remaining}</b> to go`;

    const club  = (d.clubs || {})[p.club] || {};
    const crest = CRESTS[club.crest] || '';
    const svg   = c => `<svg viewBox="0 0 24 24" class="${c}" aria-hidden="true">${crest}</svg>`;

    const rows = p.players.map(pl => `
      <li class="${pl.goals > 0 ? 'scored' : ''}">
        <span class="pos">${esc(pl.position)}</span>
        <span class="nm">${esc(pl.name)}<span class="tm">${esc(pl.teamShort)}</span>${
          pl.active ? '' : '<span class="out">OUT</span>'}</span>
        <span class="g">${pl.goals}</span>
      </li>`).join('');

    return `<article class="card ${lead ? 'lead' : ''} ${hit ? 'done' : ''} ${bust ? 'bust' : ''}"
      style="--c1:${club.c1 || '#2f3d52'};--c2:${club.c2 || '#2f3d52'};--ink:${club.ink || '#8a97ab'}">
      ${crest ? svg('crest') : ''}
      <div class="top">
        <span class="rank">${p.rank}</span>
        <span class="who">
          <span class="nom">${esc(p.name)}${bust ? `<span class="badge">${BURST}BUST</span>` : ''}</span>
          ${club.name ? `<span class="club">${svg('')}${esc(club.name)}</span>` : ''}
        </span>
        <span class="tot"><b>${p.total}</b><span>goals</span></span>
      </div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="togo"><span>${togo}</span><span>${p.total} / ${d.target}</span></div>
      <ul>${rows}</ul>
    </article>`;
  }).join('') + '</div>';
}

fetch('data/standings.json?v=' + Date.now())
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(render)
  .catch(e => {
    document.getElementById('app').innerHTML =
      '<div class="state">Could not load the standings. Please try again shortly.</div>';
    console.error(e);
  });
</script>
</body>
</html>
